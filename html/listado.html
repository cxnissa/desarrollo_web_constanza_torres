<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Listado de Avisos</title>
  <link rel="stylesheet" href="../css/style.css">
  <script src="../js/listado.js" defer></script>    
</head>

<body>
    <main>
        <a href="../html/portada.html">Volver a portada</a>

        <section id="listado">
            <h2>Listado de avisos</h2>
            <table id="tabla-avisos">
                <thead>
                    <tr>
                    <th>Publicación</th>
                    <th>Entrega</th>
                    <th>Comuna</th>
                    <th>Sector</th>
                    <th>Cant, Tipo<br>Edad</th>
                    <th>Nombre<br>Contacto</th>
                    <th>Fotos</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>

        <section id="detalle" style="display:none;">
            <h2>Detalle del aviso</h2>
            <div id="info"></div>
            <div id="galeria"></div>
            <div class="links">
                <a href="listado.html">Volver al listado</a>
                <a href="portada.html">Volver a portada</a>
            </div>
        </section>

    </main>
</body>
</html>
