<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Agregar Aviso</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/region_comuna.js" defer></script>
    <script src="../js/script.js" defer></script>
    <script src="../js/agregar.js" defer></script>    
</head>

<body>
    <main>

        <a href="../html/portada.html">Volver a portada</a>
        <h2>Nuevo aviso de adopción</h2>
        <p>Los items marcados con un asterisco (<strong>*</strong>) son obligatorios.</p>
        <form id="form-aviso">

            <fieldset>
                <legend>¿Dónde?</legend>
                <label>
                    Región<strong>*</strong> 
                    <select id="region"></select>
                </label>
                <label>
                    Comuna<strong>*</strong>
                    <select id="comuna"></select>
                </label>
                <label>
                    Sector
                    <input type="text" id="sector" maxlength="100">
                </label>
            </fieldset>

            <fieldset>
                <legend>Contacto</legend>
                <label>
                    Nombre<strong>*</strong>
                    <input type="text" id="nombre">
                </label>
                <label>
                    Email<strong>*</strong>
                    <input type="email" id="email">
                </label>
                <label>
                    Celular
                    <input type="tel" id="celular">
                </label>
                <label>
                    Contactar por
                    <select id="contactar"></select>
                </label>
                <div id="contactar-detalle"></div>
            </fieldset>

            <fieldset>
                <legend>¿Qué mascota?</legend>
                <label>
                    Tipo<strong>*</strong>
                    <select id="tipo">
                    <option value="" disabled selected>Seleccione un tipo</option> 
                    <option value="gato">Gato</option>
                    <option value="perro">Perro</option>
                    <option value="otro">Otro</option>
                    </select>
                </label>
                <div id="tipo-extra"></div> 
                <label>
                    Cantidad<strong>*</strong>
                    <input type="number" id="cantidad">
                </label>
                <label>
                    Edad<strong>*</strong>
                    <input type="number" id="edad">
                </label>
                <label>
                    Unidad<strong>*</strong>
                    <select id="unidad">
                        <option value="" disabled selected>Seleccione una unidad</option>
                        <option value="meses">Meses</option>
                        <option value ="años">Años</option>
                    </select>
                </label>
                <label>
                    Fecha entrega<strong>*</strong>
                    <input type="datetime-local" id="fecha-entrega">
                </label>
                <label for="descripcion">
                    Descripción
                </label>
                <textarea id="descripcion" cols="50" rows="10" placeholder="Detalles de la adopción..."></textarea>
                <div id="fotos-input"> Fotos<strong>*</strong></div>
            </fieldset>
            <button type="submit">Agregar este aviso</button>
        </form>

        <div id="confirmacion" class="pop-up">
            <div class="confirmacion-contenido">
                <p>¿Está seguro que desea agregar este aviso de adopción?</p>
                <button id="btn-si">Sí, estoy seguro</button>
                <button id="btn-no">No, quiero volver</button>
            </div>
        </div>

    </main>
</body>
</html>
